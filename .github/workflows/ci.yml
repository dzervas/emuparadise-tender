name: Build plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download pinned Decky CLI
        run: |
          mkdir -p "$RUNNER_TEMP/decky-cli"
          curl --fail --location --retry 3 \
            -o "$RUNNER_TEMP/decky-cli/decky" \
            "https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.8/decky-linux-x86_64"
          printf '%s  %s\n' \
            '6777e356508c1ce887f8e61b0fa4954bb48b32e6d97341eef68ea4e0d6ead9a0' \
            "$RUNNER_TEMP/decky-cli/decky" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/decky-cli/decky"

      - name: Build and package plugin
        run: |
          sudo "$RUNNER_TEMP/decky-cli/decky" plugin build \
            -o "$RUNNER_TEMP/output" -s directory "$GITHUB_WORKSPACE"

      - name: Check installable archive
        run: python3 scripts/check_plugin_archive.py "$RUNNER_TEMP/output" "$RUNNER_TEMP/Tender.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: Tender-${{ github.sha }}
          path: ${{ runner.temp }}/Tender.zip
          if-no-files-found: error
          retention-days: 14
