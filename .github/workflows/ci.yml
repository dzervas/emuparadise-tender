name: Release plugin

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver level to bump
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: tender-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare release version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Release from main only"; exit 1; }
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          RELEASE_TAG=$(python3 scripts/bump_plugin_version.py "$BUMP")
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag already exists: $RELEASE_TAG"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Package and validate plugin
        run: python3 scripts/build_plugin_archive.py "$RUNNER_TEMP/Tender.zip"

      - name: Commit version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release $RELEASE_TAG"
          git tag "$RELEASE_TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/Tender.zip" \
            --verify-tag --title "Tender $RELEASE_TAG" --generate-notes --latest
