name: Draft plugin release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (new, or already pointing at the selected commit)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: tender-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release target
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null); then
            test "$tag_commit" = "$GITHUB_SHA" || {
              echo "Release tag points at a different commit"
              exit 1
            }
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Package and validate plugin
        run: python3 scripts/build_plugin_archive.py "$RUNNER_TEMP/Tender.zip"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/Tender.zip" \
            --target "$GITHUB_SHA" --title "Tender $RELEASE_TAG" \
            --notes "Tender plugin built from commit $GITHUB_SHA." --draft
